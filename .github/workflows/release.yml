name: Release package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Install pinned Rust toolchain and WASM target
        run: rustup show
      - name: Install WASM binding generator
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Check the tag matches the package version
        run: |
          version="${GITHUB_REF_NAME#v}"
          actual=$(node -p "require('./packages/wahwah/package.json').version")
          if [ "$version" != "$actual" ]; then
            echo "Tag $GITHUB_REF_NAME does not match packages/wahwah/package.json version $actual" >&2
            exit 1
          fi
      - name: Test the package
        run: npm test --workspace wahwah
      - name: Build and pack
        run: node scripts/pack-release.mjs wahwah
      - name: Create the release with the tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/*.tgz --title "$GITHUB_REF_NAME" --notes "Install by URL. See packages/wahwah/CHANGELOG.md."
